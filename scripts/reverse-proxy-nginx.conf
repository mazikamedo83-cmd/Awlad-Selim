# AWLAD SELIM - Nginx Reverse Proxy & HTTPS Template for Laptop Central Server
# يُستخدم عند ربط اللابتوب بدومين أو شهادة SSL لتشغيل تطبيق Android و iOS من خارج شبكة المحل

server {
    listen 80;
    server_name erp.awladselim.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.awladselim.example;

    # ضع مسارات شهادة SSL (أو استخدم Cloudflare Tunnel مباشرة دون الحاجة لفتح منافذ الراوتر)
    ssl_certificate     C:/nginx/certs/fullchain.pem;
    ssl_certificate_key C:/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
