name: Build AWLAD SELIM Windows Desktop (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Build Windows Desktop Installer (EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies with Bun
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Generate Windows icons
        shell: pwsh
        run: bun run electron:icons

      - name: Run TypeScript check and backend tests
        shell: pwsh
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node server/tests/runAllTests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsx server/tests/pairingVerificationTests.mts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node server/tests/finalSecurityAuditTests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node server/tests/productionReadinessAuditTests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Desktop Installer (EXE)
        shell: pwsh
        run: bun run electron:dist

      - name: Verify EXE output and packaged UI in dist-electron
        shell: pwsh
        run: |
          if (-not (Test-Path "dist-electron")) {
            Write-Error "Missing dist-electron output directory"
            exit 1
          }
          $exes = Get-ChildItem -Path "dist-electron" -Filter "*.exe" -File
          if (-not $exes -or $exes.Count -eq 0) {
            Write-Error "No .exe installer found inside dist-electron"
            Get-ChildItem -Path "dist-electron"
            exit 1
          }
          foreach ($f in $exes) {
            if ($f.Length -le 0) {
              Write-Error "Generated EXE is empty: $($f.FullName)"
              exit 1
            }
            Write-Host "Found EXE: $($f.Name) ($([Math]::Round($f.Length / 1MB, 2)) MB)"
          }
          node server/tests/verifyElectronBootstrap.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run windows:customer-zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-windows-customer-zip.mjs --verify-only --dist-dir=dist-electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $customerZip = Get-ChildItem -Path "dist-electron" -Filter "AWLAD-SELIM-Windows-Customer-*.zip" -File | Select-Object -First 1
          if (-not $customerZip -or $customerZip.Length -le 0) {
            Write-Error "Missing or empty AWLAD-SELIM-Windows-Customer-*.zip inside dist-electron"
            exit 1
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($customerZip.FullName)
          try {
            $entryNames = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($entryNames | Where-Object { $_ -match 'Portable|\.env|\.jwt_secret|database\.json|sessions\.json|AWLAD_SELIM_BACKUP' }) {
              Write-Error "Forbidden entry found inside customer delivery ZIP"
              exit 1
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Windows-Installer
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: error
