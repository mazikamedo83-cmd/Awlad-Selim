name: Build AWLAD SELIM Windows Desktop (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Build Windows Desktop Installer (EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies with Bun
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Generate Windows icons
        shell: pwsh
        run: npm run electron:icons

      - name: Run TypeScript check and backend tests
        shell: pwsh
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node server/tests/runAllTests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Desktop Installer (EXE)
        shell: pwsh
        run: npm run electron:dist

      - name: Verify EXE output and packaged UI in dist-electron
        shell: pwsh
        run: |
          if (-not (Test-Path "dist-electron")) {
            Write-Error "Missing dist-electron output directory"
            exit 1
          }
          $exes = Get-ChildItem -Path "dist-electron" -Filter "*.exe" -File
          if (-not $exes -or $exes.Count -eq 0) {
            Write-Error "No .exe installer found inside dist-electron"
            Get-ChildItem -Path "dist-electron"
            exit 1
          }
          foreach ($f in $exes) {
            if ($f.Length -le 0) {
              Write-Error "Generated EXE is empty: $($f.FullName)"
              exit 1
            }
            Write-Host "Found EXE: $($f.Name) ($([Math]::Round($f.Length / 1MB, 2)) MB)"
          }
          node server/tests/verifyElectronBootstrap.mjs

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Windows-Installer
          path: dist-electron/*.exe
          if-no-files-found: error
