name: Build AWLAD SELIM Android Mobile App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK (Debug & Release Unsigned)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36'

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Android Unsigned Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK outputs
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Android-Unsigned-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
