name: Build AWLAD SELIM Android Debug APK (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-build:
    name: Build Experimental Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Java 21 (Required by Capacitor 8 & AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Run TypeScript lint check
        run: bun run lint

      - name: Run automated verification tests
        run: |
          node --experimental-strip-types server/tests/masterRepairVerificationTests.mjs
          node --experimental-strip-types server/tests/comprehensiveReportsTests.mjs
          node --experimental-strip-types server/tests/pairingVerificationTests.mts

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK (No production signing, App Links disabled)
        working-directory: android
        env:
          AWLAD_APP_LINK_HOST: ''
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK & Merged Manifest Safety
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh android/app/build/outputs/apk/debug/
          MERGED_MANIFEST=$(find android/app/build/intermediates/merged_manifests android/app/build/intermediates/merged_manifest -name AndroidManifest.xml 2>/dev/null | head -n 1 || true)
          if [ -n "$MERGED_MANIFEST" ]; then
            echo "Checking merged manifest: $MERGED_MANIFEST"
            if grep -q 'android:autoVerify="true"' "$MERGED_MANIFEST"; then
              echo "ERROR: App Links autoVerify should be disabled when AWLAD_APP_LINK_HOST is unset"
              exit 1
            fi
          fi

      - name: Upload Experimental Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
