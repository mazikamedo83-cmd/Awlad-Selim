name: Build AWLAD SELIM iOS Production Release IPA

on:
  workflow_dispatch:
    inputs:
      distribution_method:
        description: 'Official private distribution method (no public App Store)'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - enterprise
          - release-testing

permissions:
  contents: read

jobs:
  ios-release-build:
    name: Archive & Sign iOS IPA (macOS Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Apple Developer Signing Secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$CERT_B64" ] || [ -z "$CERT_PASS" ] || [ -z "$PROFILE_B64" ]; then
            echo "ERROR: Missing Apple Developer signing secrets in GitHub Repository Secrets:"
            echo "  Required: APPLE_TEAM_ID, IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64"
            echo "  An active Apple Developer Program account is required to generate Distribution Certificate (.p12) and Provisioning Profile (.mobileprovision)."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Run lint, build, and sync iOS project
        run: |
          npm run lint
          npm run build
          npx cap sync ios

      - name: Install Apple Distribution Certificate and Provisioning Profile
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/awlad-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          CERT_PATH="${RUNNER_TEMP}/dist.p12"
          PROFILE_PATH="${RUNNER_TEMP}/profile.mobileprovision"

          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "IOS_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=${PROFILE_UUID}" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=${PROFILE_NAME}" >> "$GITHUB_ENV"

      - name: Build Xcode Release Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${RUNNER_TEMP}/AWLAD-SELIM.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            clean archive

      - name: Export Signed Production IPA (Private Distribution)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_METHOD: ${{ github.event.inputs.distribution_method }}
        run: |
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${DIST_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.awladselim.erp</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/AWLAD-SELIM.xcarchive" \
            -exportPath "${RUNNER_TEMP}/ipa-out" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist"

          VERSION=$(node -p "require('./package.json').version")
          GENERATED_IPA=$(find "${RUNNER_TEMP}/ipa-out" -name "*.ipa" | head -n 1)
          test -s "$GENERATED_IPA"
          mkdir -p "${RUNNER_TEMP}/release-ipa"
          FINAL_IPA="${RUNNER_TEMP}/release-ipa/AWLAD-SELIM-${VERSION}-iOS.ipa"
          cp "$GENERATED_IPA" "$FINAL_IPA"

          # Verify code signature inside IPA
          UNZIP_DIR="${RUNNER_TEMP}/ipa-verify"
          unzip -q "$FINAL_IPA" -d "$UNZIP_DIR"
          codesign --verify --deep --strict --verbose=2 "${UNZIP_DIR}/Payload/App.app"
          ls -lh "$FINAL_IPA"

      - name: Cleanup ephemeral Apple signing credentials
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/dist.p12" "${RUNNER_TEMP}/profile.mobileprovision"
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi

      - name: Upload Signed iOS Release IPA
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-iOS-Release-IPA
          path: ${{ runner.temp }}/release-ipa/AWLAD-SELIM-*-iOS.ipa
          if-no-files-found: error
          retention-days: 30
