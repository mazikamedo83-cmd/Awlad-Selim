name: AWLAD SELIM CI Verification (TypeScript, Security & PostgreSQL)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-all:
    name: Build, Lint & Full Test Matrix (JSON + Real PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: awlad_selim_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies with frozen lockfile
        run: bun install --frozen-lockfile

      - name: TypeScript & type check
        run: bun run lint

      - name: Build production web bundle & verify asset hygiene
        run: |
          bun run build
          test -s dist/index.html
          test ! -e dist/assets/aistudio

      - name: Run full backend, reports, audit, pairing & client verification suites
        run: |
          node server/tests/runAllTests.mjs
          node server/tests/repPurchaseCustomerRbacTests.mjs
          node server/tests/masterRepairVerificationTests.mjs
          node server/tests/comprehensiveReportsTests.mjs
          node server/tests/auditVerificationTests.mjs
          npx tsx server/tests/pairingVerificationTests.mts
          node server/tests/strictPostgresModeTests.mjs
          npx tsx server/tests/strictClientBehaviorTests.mts
          node server/tests/verifyElectronBootstrap.mjs
          node server/tests/securityCompletionTests.mjs
          npx tsx server/tests/clientSecurityCompletionTests.mts
          node server/tests/fullCompletionSuite.mjs
          node server/tests/finalSecurityAuditTests.mjs
          node server/tests/productionReadinessAuditTests.mjs
          node server/tests/identityAndFiltersTests.mjs
          node server/tests/branchCollectionAndAuditTests.mjs
          node server/tests/storefrontAndLocationTests.mjs
          node server/tests/offlineRefreshAndDispatchTests.mjs
          node server/tests/platformUiCorrectionTests.mjs
          node server/tests/dashboardBalanceVisibilityTests.mjs
          npx tsx server/tests/offlineClientFlowChecks.mts
          npx tsx server/tests/diagnosticsTests.mts

      - name: Verify full schema, transactions, dispatches & strict disconnect against real PostgreSQL 16
        env:
          DATABASE_URL: postgres://postgres:ci_postgres_password@localhost:5432/awlad_selim_ci
          AWLAD_REQUIRE_POSTGRES: 'true'
          JWT_SECRET: ci_test_jwt_secret_key_for_postgres_verification_2026
          BOOTSTRAP_ADMIN_SECRET: ci_bootstrap_secret_2026
        run: node server/tests/postgresRealIntegrationTests.mjs
