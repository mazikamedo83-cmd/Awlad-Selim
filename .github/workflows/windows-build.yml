name: Build AWLAD SELIM Windows Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Release (Setup & Portable EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Read app release version
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $version = $pkg.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Missing version in package.json"
            exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Target Windows Release version: $version"

      - name: Verify bun.lock exists
        shell: pwsh
        run: |
          if (-not (Test-Path "bun.lock")) {
            Write-Error "Missing required lockfile: bun.lock"
            exit 1
          }
          Get-Item "bun.lock" | Select-Object Name, Length

      - name: Install dependencies with Bun
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Generate Windows icons from official logo
        shell: pwsh
        run: node scripts/generate-win-icon.mjs

      - name: Verify Windows icon assets
        shell: pwsh
        run: |
          if (-not (Test-Path "build/icon.ico")) {
            Write-Error "Missing required icon file: build/icon.ico"
            exit 1
          }
          if (-not (Test-Path "build/icon.png")) {
            Write-Error "Missing required icon file: build/icon.png"
            exit 1
          }
          Get-Item "build/icon.ico", "build/icon.png" | Select-Object Name, Length

      - name: Run TypeScript check
        shell: pwsh
        run: bun run lint

      - name: Run backend and PostgreSQL test suite
        shell: pwsh
        run: |
          node server/tests/runAllTests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsx server/tests/pairingVerificationTests.mts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node server/tests/strictPostgresModeTests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsx server/tests/strictClientBehaviorTests.mts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build frontend and Windows Release EXEs
        shell: pwsh
        run: bun run electron:dist

      - name: Run Electron bootstrap and persistence tests
        shell: pwsh
        run: node server/tests/verifyElectronBootstrap.mjs

      - name: Package & Verify Organized Customer Delivery ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          bun run windows:customer-zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $customerZip = "dist-electron/AWLAD-SELIM-Windows-Customer-$version.zip"
          if (-not (Test-Path $customerZip)) {
            Write-Error "Customer delivery ZIP was not created at expected path: $customerZip"
            exit 1
          }
          $zipInfo = Get-Item $customerZip
          if ($zipInfo.Length -le 0) {
            Write-Error "Customer delivery ZIP is empty: $customerZip"
            exit 1
          }

          node scripts/package-windows-customer-zip.mjs --verify-only --dist-dir=dist-electron --version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $customerZip))
          try {
            $entryNames = @($archive.Entries | ForEach-Object { $_.FullName })
            Write-Host "ZIP archive entries ($($entryNames.Count)):"
            $entryNames | ForEach-Object { Write-Host "  - $_" }
            if ($entryNames -notcontains "AWLAD-SELIM-Windows-Customer-$version/01-Installer/AWLAD-SELIM-Setup-$version.exe") {
              Write-Error "Customer ZIP missing AWLAD-SELIM-Setup-$version.exe"
              exit 1
            }
            if ($entryNames | Where-Object { $_ -match 'Portable|\.env|\.jwt_secret|database\.json|sessions\.json|AWLAD_SELIM_BACKUP|server/tests|node_modules' }) {
              Write-Error "Customer ZIP contains forbidden Portable/secret/dev/data files"
              exit 1
            }
          } finally {
            $archive.Dispose()
          }

      - name: Verify Windows Release EXEs, Hygiene & SHA-256
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $expectedInstaller = "dist-electron/AWLAD-SELIM-Setup-$version.exe"
          $expectedPortable = "dist-electron/AWLAD-SELIM-Portable-$version.exe"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows Production Release v$version"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| File | Size (MB) | SHA-256 |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|---|---|---|"

          foreach ($targetExe in @($expectedInstaller, $expectedPortable)) {
            if (-not (Test-Path $targetExe)) {
              Write-Error "Expected Windows executable not found: $targetExe"
              if (Test-Path "dist-electron") {
                Get-ChildItem -Path "dist-electron"
              }
              exit 1
            }
            $file = Get-Item $targetExe
            if ($file.Length -le 0) {
              Write-Error "Generated Windows executable is empty: $($file.FullName)"
              exit 1
            }
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $sizeMb = [Math]::Round($file.Length / 1MB, 2)
            Write-Host "Verified Windows Release EXE: $($file.Name) ($sizeMb MB) SHA-256=$hash"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| ``$($file.Name)`` | $sizeMb MB | ``$hash`` |"
          }

          $unpackedApp = "dist-electron/win-unpacked/resources/app"
          if (-not (Test-Path "$unpackedApp/dist/index.html")) {
            Write-Error "Missing packaged dist/index.html inside $unpackedApp"
            exit 1
          }
          foreach ($forbidden in @(
            "$unpackedApp/AWLAD_SELIM_BACKUP",
            "$unpackedApp/dist/assets/aistudio",
            "$unpackedApp/server/data",
            "$unpackedApp/.env",
            "$unpackedApp/server/data/.jwt_secret"
          )) {
            if (Test-Path $forbidden) {
              Write-Error "Forbidden secret or data file leaked into packaged Windows app: $forbidden"
              exit 1
            }
          }
          $jsFiles = Get-ChildItem -Path "$unpackedApp/dist/assets" -Filter "index-*.js"
          if (-not $jsFiles -or $jsFiles.Count -eq 0) {
            Write-Error "Missing compiled index-*.js bundle in packaged dist/assets"
            exit 1
          }
          $bundleContent = Get-Content $jsFiles[0].FullName -Raw
          if (-not $bundleContent.Contains("v$version")) {
            Write-Error "Packaged JS bundle does not contain current version marker v$version"
            exit 1
          }

          $customerZip = "dist-electron/AWLAD-SELIM-Windows-Customer-$version.zip"
          if (-not (Test-Path $customerZip)) {
            Write-Error "Missing organized customer delivery ZIP: $customerZip"
            exit 1
          }
          $zipFile = Get-Item $customerZip
          if ($zipFile.Length -le 0) {
            Write-Error "Generated customer delivery ZIP is empty: $($zipFile.FullName)"
            exit 1
          }
          $zipHash = (Get-FileHash -Path $zipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSizeMb = [Math]::Round($zipFile.Length / 1MB, 2)
          Write-Host "Verified Customer Delivery ZIP: $($zipFile.Name) ($zipSizeMb MB) SHA-256=$zipHash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| ``$($zipFile.Name)`` | $zipSizeMb MB | ``$zipHash`` |"

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Windows-${{ steps.meta.outputs.version }}
          path: |
            dist-electron/AWLAD-SELIM-Setup-${{ steps.meta.outputs.version }}.exe
            dist-electron/AWLAD-SELIM-Portable-${{ steps.meta.outputs.version }}.exe
            dist-electron/AWLAD-SELIM-Windows-Customer-${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Attach Windows EXEs & Customer ZIP to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-electron/AWLAD-SELIM-Setup-${{ steps.meta.outputs.version }}.exe
            dist-electron/AWLAD-SELIM-Portable-${{ steps.meta.outputs.version }}.exe
            dist-electron/AWLAD-SELIM-Windows-Customer-${{ steps.meta.outputs.version }}.zip
