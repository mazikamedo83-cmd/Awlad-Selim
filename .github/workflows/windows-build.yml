name: Build AWLAD SELIM Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Setup.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify bun.lock exists
        shell: pwsh
        run: |
          if (-not (Test-Path "bun.lock")) {
            Write-Error "Missing required lockfile: bun.lock"
            exit 1
          }
          Get-Item "bun.lock" | Select-Object Name, Length

      - name: Install dependencies with Bun
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Windows icons from official logo
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $script = '
          import os
          from PIL import Image

          src_path = os.path.join("public", "awlad-selim-logo.png")
          if not os.path.isfile(src_path):
              raise FileNotFoundError(f"Missing official logo: {src_path}")

          os.makedirs("build", exist_ok=True)
          img = Image.open(src_path).convert("RGBA")
          bbox = img.getbbox()
          if bbox:
              img = img.crop(bbox)

          max_dim = 472
          ratio = min(max_dim / img.width, max_dim / img.height)
          new_size = (max(1, round(img.width * ratio)), max(1, round(img.height * ratio)))
          resized = img.resize(new_size, Image.Resampling.LANCZOS)

          canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          offset = ((512 - new_size[0]) // 2, (512 - new_size[1]) // 2)
          canvas.paste(resized, offset, resized)

          png_path = os.path.join("build", "icon.png")
          ico_path = os.path.join("build", "icon.ico")
          canvas.save(png_path, format="PNG")
          canvas.save(ico_path, format="ICO", sizes=[(16, 16), (32, 32), (48, 48), (256, 256)])
          print("Generated build/icon.png and build/icon.ico successfully.")
          '
          python -c $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows icon assets
        shell: pwsh
        run: |
          if (-not (Test-Path "build/icon.ico")) {
            Write-Error "Missing required icon file: build/icon.ico"
            exit 1
          }
          if (-not (Test-Path "build/icon.png")) {
            Write-Error "Missing required icon file: build/icon.png"
            exit 1
          }
          Get-Item "build/icon.ico", "build/icon.png" | Select-Object Name, Length

      - name: Run TypeScript check
        shell: pwsh
        run: bun run lint

      - name: Run backend and PostgreSQL test suite
        shell: pwsh
        run: node server/tests/runAllTests.mjs

      - name: Build frontend and Windows Setup.exe
        shell: pwsh
        run: bun run electron:dist

      - name: Run Electron bootstrap and persistence tests
        shell: pwsh
        run: node server/tests/verifyElectronBootstrap.mjs

      - name: Verify Setup.exe in dist-electron
        shell: pwsh
        run: |
          $setupFiles = Get-ChildItem -Path "dist-electron" -Filter "*Setup*.exe" -File
          if (-not $setupFiles -or $setupFiles.Count -eq 0) {
            Write-Error "Setup.exe was not generated inside dist-electron."
            if (Test-Path "dist-electron") {
              Get-ChildItem -Path "dist-electron"
            }
            exit 1
          }
          foreach ($file in $setupFiles) {
            if ($file.Length -le 0) {
              Write-Error "Generated installer file is empty: $($file.FullName)"
              exit 1
            }
            Write-Host "Found installer: $($file.Name) ($([Math]::Round($file.Length / 1MB, 2)) MB)"
          }

      - name: Upload Windows Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWLAD-SELIM-Windows-Setup
          path: dist-electron/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
