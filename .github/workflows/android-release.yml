name: Build AWLAD SELIM Android Production Release APK

on:
  workflow_dispatch:
    inputs:
      app_link_host:
        description: 'Optional verified public HTTPS domain for Android App Links (leave empty to keep App Links disabled)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  android-release-build:
    name: Build Signed Production Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21 (Required by Capacitor 8 & AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Validate Production Signing Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "ERROR: Missing Android Release signing secrets in GitHub Repository Secrets:"
            echo "  Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            echo "  Never use debug.keystore for Production Release builds."
            exit 1
          fi

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Run TypeScript lint & automated pairing/security tests
        run: |
          npm run lint
          npx tsx server/tests/pairingVerificationTests.mts

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Decode Release Keystore to ephemeral runner temp path
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/awlad-release.jks"
          test -s "${RUNNER_TEMP}/awlad-release.jks"

      - name: Build Signed Production Release APK
        working-directory: android
        env:
          AWLAD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/awlad-release.jks
          AWLAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AWLAD_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AWLAD_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AWLAD_APP_LINK_HOST: ${{ github.event.inputs.app_link_host }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signature, Metadata, and Version 3.0.0
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RAW_APK="android/app/build/outputs/apk/release/app-release.apk"
          FINAL_APK="android/app/build/outputs/apk/release/AWLAD-SELIM-${VERSION}-release.apk"
          test -s "$RAW_APK"
          cp "$RAW_APK" "$FINAL_APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"
          ls -lh "$FINAL_APK"

      - name: Cleanup ephemeral keystore file
        if: always()
        run: rm -f "${RUNNER_TEMP}/awlad-release.jks"

      - name: Upload Signed Android Release APK
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Android-Release-APK
          path: android/app/build/outputs/apk/release/AWLAD-SELIM-*-release.apk
          if-no-files-found: error
          retention-days: 90
