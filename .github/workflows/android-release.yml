name: Build AWLAD SELIM Android Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: Build Signed Android Production Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Read app release version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "ERROR: Missing version in package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Android Release version: $VERSION"

      - name: Setup Java 21 (Required by Capacitor 8 & AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify bun.lock exists
        run: test -f bun.lock

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        run: bun run lint

      - name: Run full backend, reports, audit, pairing & client test suites
        run: |
          node server/tests/runAllTests.mjs
          node server/tests/repPurchaseCustomerRbacTests.mjs
          node server/tests/masterRepairVerificationTests.mjs
          node server/tests/comprehensiveReportsTests.mjs
          node server/tests/auditVerificationTests.mjs
          npx tsx server/tests/pairingVerificationTests.mts
          node server/tests/strictPostgresModeTests.mjs
          npx tsx server/tests/strictClientBehaviorTests.mts
          node server/tests/securityCompletionTests.mjs
          npx tsx server/tests/clientSecurityCompletionTests.mts
          node server/tests/fullCompletionSuite.mjs
          node server/tests/finalSecurityAuditTests.mjs
          node server/tests/productionReadinessAuditTests.mjs
          node server/tests/identityAndFiltersTests.mjs
          node server/tests/branchCollectionAndAuditTests.mjs
          node server/tests/storefrontAndLocationTests.mjs
          node server/tests/offlineRefreshAndDispatchTests.mjs
          node server/tests/platformUiCorrectionTests.mjs
          node server/tests/dashboardBalanceVisibilityTests.mjs
          npx tsx server/tests/offlineClientFlowChecks.mts
          npx tsx server/tests/diagnosticsTests.mts

      - name: Build production web bundle
        run: |
          bun run build
          test -f dist/awlad-selim-logo.png
          test ! -e dist/product-images
          test ! -e dist/assets/aistudio

      - name: Run Electron bootstrap and offline dist verification
        run: node server/tests/verifyElectronBootstrap.mjs

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android
          test -f android/app/src/main/assets/public/awlad-selim-logo.png
          test ! -e android/app/src/main/assets/public/product-images
          test ! -e android/app/src/main/assets/public/assets/aistudio

      - name: Validate Production Signing Secrets & Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Production Android signing secrets are missing."
            echo "Configure GitHub Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (AWLAD-SELIM), ANDROID_KEY_PASSWORD."
            echo "Refusing to fall back to debug signing for a Production Release."
            exit 1
          fi
          if [ "${KEY_ALIAS,,}" = "androiddebugkey" ]; then
            echo "ERROR: Refusing to sign Android Release with androiddebugkey."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "${{ runner.temp }}/AWLAD-SELIM-Release.jks"
          chmod 600 "${{ runner.temp }}/AWLAD-SELIM-Release.jks"
          test -s "${{ runner.temp }}/AWLAD-SELIM-Release.jks"
          if ! keytool -list -v -keystore "${{ runner.temp }}/AWLAD-SELIM-Release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > "${{ runner.temp }}/keytool-check.txt" 2>&1; then
            echo "ERROR: Decoded Android keystore could not be unlocked with ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS."
            exit 1
          fi
          grep -E "Alias name:|Entry type:|Owner:|SHA256:|Valid from:" "${{ runner.temp }}/keytool-check.txt"
          rm -f "${{ runner.temp }}/keytool-check.txt"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK & AAB
        working-directory: android
        env:
          AWLAD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/AWLAD-SELIM-Release.jks
          AWLAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AWLAD_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AWLAD_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AWLAD_APP_LINK_HOST: ${{ vars.AWLAD_APP_LINK_HOST || '' }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify Signed Release APK, AAB, Non-Debug & SHA-256
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK_PATH"
          test -s "$AAB_PATH"

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT2" ]; then
            echo "ERROR: apksigner or aapt2 not found in Android build-tools"
            exit 1
          fi

          CERT_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -qi "Android Debug"; then
            echo "ERROR: APK is signed with Android Debug certificate!"
            exit 1
          fi

          BADGING=$("$AAPT2" dump badging "$APK_PATH")
          echo "$BADGING" | head -n 10
          if ! echo "$BADGING" | grep -q "package: name='com.awladselim.erp'"; then
            echo "ERROR: Unexpected package ID in release APK! Expected com.awladselim.erp"
            exit 1
          fi
          jarsigner -verify -verbose -certs "$APK_PATH"
          jarsigner -verify -verbose -certs "$AAB_PATH"

          MERGED_MANIFEST=$(find android/app/build/intermediates/merged_manifests android/app/build/intermediates/merged_manifest -name AndroidManifest.xml 2>/dev/null | grep -i release | head -n 1 || true)
          if [ -n "$MERGED_MANIFEST" ] && grep -q 'android:debuggable="true"' "$MERGED_MANIFEST"; then
            echo "ERROR: Release manifest must never enable android:debuggable=true"
            exit 1
          fi

          if unzip -l "$APK_PATH" | grep -iE "\.jks$|\.keystore$|keystore\.properties$|\.env$|\.jwt_secret$|database\.json$|product-images/|assets/aistudio/"; then
            echo "ERROR: Secret, deleted asset, or database file leaked inside APK!"
            exit 1
          fi
          if unzip -l "$AAB_PATH" | grep -iE "\.jks$|\.keystore$|keystore\.properties$|\.env$|\.jwt_secret$|database\.json$|product-images/|assets/aistudio/"; then
            echo "ERROR: Secret, deleted asset, or database file leaked inside AAB!"
            exit 1
          fi

          mkdir -p dist-android
          OUT_APK="dist-android/AWLAD-SELIM-${VERSION}-Release.apk"
          OUT_AAB="dist-android/AWLAD-SELIM-${VERSION}-Release.aab"
          cp "$APK_PATH" "$OUT_APK"
          cp "$AAB_PATH" "$OUT_AAB"
          ls -lh dist-android/

          APK_SHA256=$(sha256sum "$OUT_APK" | awk '{print $1}')
          AAB_SHA256=$(sha256sum "$OUT_AAB" | awk '{print $1}')
          echo "SHA-256 ($OUT_APK): $APK_SHA256"
          echo "SHA-256 ($OUT_AAB): $AAB_SHA256"

          {
            echo "## Android Production Release v${VERSION}"
            echo "| File | SHA-256 |"
            echo "|---|---|"
            echo "| \`AWLAD-SELIM-${VERSION}-Release.apk\` | \`${APK_SHA256}\` |"
            echo "| \`AWLAD-SELIM-${VERSION}-Release.aab\` | \`${AAB_SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/AWLAD-SELIM-Release.jks" "${{ runner.temp }}/keytool-check.txt"

      - name: Upload Signed Android Production Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Android-${{ steps.meta.outputs.version }}
          path: |
            dist-android/AWLAD-SELIM-${{ steps.meta.outputs.version }}-Release.apk
            dist-android/AWLAD-SELIM-${{ steps.meta.outputs.version }}-Release.aab
          if-no-files-found: error
          retention-days: 90
