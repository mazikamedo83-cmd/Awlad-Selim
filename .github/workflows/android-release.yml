name: Build AWLAD SELIM Android Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    name: Build Signed Android Production Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Java 21 (Required by Capacitor 8 & AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify bun.lock exists
        run: test -f bun.lock

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        run: bun run lint

      - name: Run backend and PostgreSQL test suites
        run: |
          node server/tests/runAllTests.mjs
          npx tsx server/tests/pairingVerificationTests.mts

      - name: Build production web bundle
        run: bun run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Validate Production Signing Secrets & Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.AWLAD_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.AWLAD_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.AWLAD_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.AWLAD_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Production Android signing secrets are missing."
            echo "Configure GitHub Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            echo "Refusing to fall back to debug signing for a Production Release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/awlad-selim-release.keystore"
          test -s "${{ runner.temp }}/awlad-selim-release.keystore"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK & AAB
        working-directory: android
        env:
          AWLAD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/awlad-selim-release.keystore
          AWLAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.AWLAD_ANDROID_KEYSTORE_PASSWORD }}
          AWLAD_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.AWLAD_ANDROID_KEY_ALIAS }}
          AWLAD_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.AWLAD_ANDROID_KEY_PASSWORD }}
          AWLAD_APP_LINK_HOST: ${{ vars.AWLAD_APP_LINK_HOST || '' }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify Signed Release APK & AAB Integrity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.AWLAD_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK_PATH"
          test -s "$AAB_PATH"

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found in Android build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          jarsigner -verify -verbose -certs "$AAB_PATH"

          MERGED_MANIFEST=$(find android/app/build/intermediates/merged_manifests android/app/build/intermediates/merged_manifest -name AndroidManifest.xml 2>/dev/null | grep -i release | head -n 1 || true)
          if [ -n "$MERGED_MANIFEST" ] && grep -q 'android:debuggable="true"' "$MERGED_MANIFEST"; then
            echo "ERROR: Release manifest must never enable android:debuggable=true"
            exit 1
          fi

          mkdir -p dist-android
          cp "$APK_PATH" "dist-android/AWLAD-SELIM-v${VERSION}-release.apk"
          cp "$AAB_PATH" "dist-android/AWLAD-SELIM-v${VERSION}-release.aab"
          ls -lh dist-android/

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/awlad-selim-release.keystore"

      - name: Upload Signed Android Production Artifacts (APK & AAB)
        uses: actions/upload-artifact@v6
        with:
          name: AWLAD-SELIM-Android-Release
          path: |
            dist-android/AWLAD-SELIM-v*-release.apk
            dist-android/AWLAD-SELIM-v*-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Attach Android Release APK & AAB to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-android/AWLAD-SELIM-v*-release.apk
            dist-android/AWLAD-SELIM-v*-release.aab
