apply plugin: 'com.android.application'

def rawAppLinkHost = (project.findProperty('AWLAD_APP_LINK_HOST') ?: System.getenv('AWLAD_APP_LINK_HOST') ?: '').toString().trim().toLowerCase()
def configuredAppLinkHost = rawAppLinkHost.replaceFirst('^https?://', '').split('/')[0].split(':')[0].trim()
def enableVerifiedAppLinks = (
    !configuredAppLinkHost.isEmpty() &&
    configuredAppLinkHost != 'awladselim.app' &&
    configuredAppLinkHost != 'localhost' &&
    configuredAppLinkHost.contains('.') &&
    !configuredAppLinkHost.matches('^\\d+(\\.\\d+){3}$') &&
    !configuredAppLinkHost.contains(' ')
)

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseKeystorePath = (
    System.getenv('AWLAD_ANDROID_KEYSTORE_PATH') ?:
    System.getenv('ANDROID_KEYSTORE_PATH') ?:
    keystoreProperties.getProperty('storeFile') ?:
    ''
).toString().trim()
def releaseKeystorePassword = (
    System.getenv('AWLAD_ANDROID_KEYSTORE_PASSWORD') ?:
    System.getenv('ANDROID_KEYSTORE_PASSWORD') ?:
    keystoreProperties.getProperty('storePassword') ?:
    ''
).toString()
def releaseKeyAlias = (
    System.getenv('AWLAD_ANDROID_KEY_ALIAS') ?:
    System.getenv('ANDROID_KEY_ALIAS') ?:
    keystoreProperties.getProperty('keyAlias') ?:
    ''
).toString().trim()
def releaseKeyPassword = (
    System.getenv('AWLAD_ANDROID_KEY_PASSWORD') ?:
    System.getenv('ANDROID_KEY_PASSWORD') ?:
    keystoreProperties.getProperty('keyPassword') ?:
    ''
).toString()

def resolvedKeystoreFile = null
if (releaseKeystorePath) {
    def expandedKeystorePath = releaseKeystorePath.startsWith('~/')
        ? (System.getProperty('user.home') + releaseKeystorePath.substring(1))
        : releaseKeystorePath
    def appRelativeKeystore = file(expandedKeystorePath)
    def rootRelativeKeystore = rootProject.file(expandedKeystorePath)
    resolvedKeystoreFile = appRelativeKeystore.exists() ? appRelativeKeystore : rootRelativeKeystore
}

def isDebugKeystoreAttempt = (
    (releaseKeystorePath && releaseKeystorePath.toLowerCase().endsWith('debug.keystore')) ||
    (releaseKeyAlias && releaseKeyAlias.equalsIgnoreCase('androiddebugkey'))
)

def hasValidReleaseSigning = (
    !isDebugKeystoreAttempt &&
    resolvedKeystoreFile != null &&
    resolvedKeystoreFile.exists() &&
    !releaseKeystorePassword.isEmpty() &&
    !releaseKeyAlias.isEmpty() &&
    !releaseKeyPassword.isEmpty()
)

android {
    namespace = "com.awladselim.erp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.awladselim.erp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (enableVerifiedAppLinks) {
            manifestPlaceholders += [appLinkHost: configuredAppLinkHost]
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasValidReleaseSigning) {
                storeFile resolvedKeystoreFile
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    if (enableVerifiedAppLinks) {
        sourceSets {
            debug {
                manifest.srcFile 'src/applinks/AndroidManifest.xml'
            }
            release {
                manifest.srcFile 'src/applinks/AndroidManifest.xml'
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasValidReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def buildingRelease = taskGraph.allTasks.any {
        it.name.toLowerCase().contains('release') && (it.name.contains('assemble') || it.name.contains('bundle') || it.name.contains('package'))
    }
    if (buildingRelease && isDebugKeystoreAttempt) {
        throw new GradleException(
            'Refusing to sign a Production Release with debug.keystore / androiddebugkey. Generate a dedicated production keystore instead.'
        )
    }
    if (buildingRelease && !hasValidReleaseSigning) {
        throw new GradleException(
            'Production Release signing keystore is not configured. Provide android/keystore.properties or AWLAD_ANDROID_KEYSTORE_* environment variables (never use debug signing for Release).'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
